name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Stopki polis: liczba stron ma być liczona polem NUMPAGES.
      # Szablony przychodzą od InterRisk z liczbą wpisaną na sztywno.
      # Rozpoznawanie kodów opiekuna decyduje, KOMU liczy się sprzedaż.
      # Próg pewności i margines nad drugim kandydatem to dwie liczby, których
      # skutków nie widać w typach - dopiero lista przypadków pokazuje, co
      # system ma łapać i czego ma NIE zgadywać.
      - run: npm run check:kody
      - run: npm run check:numeracja
      # Ulotki przychodzą od dostawcy WYPEŁNIONE przykładem. Pole, któremu przy
      # budowie mapy nie nadano roli, nie jest nadpisywane - i cudza szkoła albo
      # cudzy opiekun jedzie na ulotce każdej placówki.
      # check:ulotki czyta tekst gotowego PDF-a, żeby sprawdzić, co NAPRAWDĘ
      # wyszło na wydruku - do tego potrzebny jest pdftotext z poppler-utils.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run check:ulotki
      - run: npm run lint
      - run: npm run build
        env:
          # build/type-check doesn't connect, but Prisma wants the var present
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
